defaults:
  - _self_
  - dataset: cuneiform # Can be: aids actor planetoid karate attributed webkb enzymes protein 
  - model: gine # Can be: gcn gat cheb
  - optimizer: adam
  - general: general_default
  - task: graph # Can be: node or graph
  - explainer: combinex # Can be: gnnexplainer | cf-gnn | combinex | ego | random | random-feat
  - trainer: trainer
  - logger: wandb
  - scheduler: scheduler


verbose: False
random_num_epochs: 500
device: cuda
workers: 1
path: ""
seed: 1
run_mode: run
figure: True
# Project name on wandb
project: COMBINEX-WITH-EDGE-ATTRS
name: test

# Eventual timeout in seconds to kill the process
timeout: 500

# Number of agents to carry out the simulation
num_agents: 1
test_size: 0.2
max_samples: 100