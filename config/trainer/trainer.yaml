
# Optimizer settings
optimizer: "adamw"  # adam, adamw, sgd, rmsprop, adagrad, adadelta, adamax, nadam, radam
lr: 0.001
weight_decay: 1e-4

# Adam/AdamW specific
betas: [0.9, 0.999]
eps: 1e-8
amsgrad: false
epochs: 500
# SGD specific
momentum: 0.9
nesterov: true

# Scheduler settings
use_scheduler: true
scheduler: "cosine"  # plateau, cosine, cosine_restart, step, multistep, etc.

# Plateau scheduler
scheduler_mode: "min"
scheduler_factor: 0.5
scheduler_patience: 10

# Cosine scheduler
eta_min: 1e-6

# Step scheduler
scheduler_step_size: 50
scheduler_gamma: 0.1

# Warmup cosine
warmup_epochs: 10

batch_size: 64